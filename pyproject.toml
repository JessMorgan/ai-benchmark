[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-benchmark"
version = "0.1.0"
description = "Multi-source, plugin-based benchmark for code generation and reasoning LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["benchmark", "llm", "evaluation", "openai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "fpdf2>=2.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
ai-benchmark = "benchmark.cli:main"

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools]
packages = [
    "benchmark",
    "plugins",
    "plugins.challenges",
    "plugins.outputs",
]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/challenges", "plugins/outputs"]
pythonpath = ["."]

[tool.coverage.run]
source = ["benchmark", "plugins"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100
