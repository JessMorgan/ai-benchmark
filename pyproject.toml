[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-benchmark"
version = "0.1.0"
description = "Multi-source, plugin-based benchmark for code generation and reasoning LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["benchmark", "llm", "evaluation", "openai", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.32.0",
    "fpdf2>=2.8.0",
    "pyyaml>=6.0.2",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.2",
    "wcwidth>=0.8.2",
    "psutil>=7.2.2",
    "jinja2>=3.1.6",
    "shtab>=1.11.0",
    "jsonschema>=4.26.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
ai-benchmark = "benchmark.cli:main"

# Dev tooling installs with `uv sync` (dev is a default group).
[dependency-groups]
dev = [
    "coverage>=7.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
packages = [
    "benchmark",
    "plugins",
    "plugins.challenges",
    "plugins.outputs",
]

[tool.pytest.ini_options]
testpaths = ["tests", "plugins/challenges", "plugins/outputs"]
pythonpath = ["."]

[tool.coverage.run]
source = ["benchmark", "plugins"]
branch = true
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "skip"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.ruff]
target-version = "py310"
line-length = 100
# Untracked experiment/result snapshots (copies of other machines' trees) are
# not part of this project; pre-commit skips them but a root-level ruff run
# would otherwise lint them.
exclude = [
    "2026-*/",
    "ai-judging/",
    "gaming-pc-temperature-test/",
    "benchmark-results*/",
    "complete-results*/",
    "htmlcov/",
    ".omo/",
]
