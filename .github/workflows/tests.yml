name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (uv sync)
        run: uv sync --frozen

      - name: Run pre-commit hooks
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run Ruff and strict production typing
        run: |
          uv run ruff check benchmark plugins tests
          uv run mypy --strict benchmark plugins --exclude 'test_' --exclude 'benchmark/cli.py'

      - name: Compile Python sources
        run: uv run python -m compileall -q benchmark plugins ai-benchmark.py

      - name: Run persistence contract tests
        run: |
          uv run pytest \
            tests/test_storage.py \
            tests/test_sqlite_writer.py \
            tests/test_state.py \
            tests/test_sqlite_integrity.py -q

      - name: Run unit tests with coverage
        run: |
          uv run coverage run -m pytest tests/ plugins/challenges/ plugins/outputs/ -q
          uv run coverage report -m
          uv run coverage report --fail-under=90
