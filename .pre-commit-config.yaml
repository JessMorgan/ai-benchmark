default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # Ruff version comes from the uv-managed dev group (pyproject.toml),
      # so CI and local runs always use the same linter.
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: python-syntax-check
        name: Python syntax check
        entry: python -m py_compile
        language: system
        types: [python]

      - id: mypy
        name: mypy type check
        entry: mypy
        language: system
        types: [python]
        require_serial: true

      - id: cli-smoke-test
        name: CLI smoke test
        entry: python ai-benchmark.py --dump-default-config
        language: system
        pass_filenames: false
        types: [python]

      - id: tests-pre-push
        name: Run unit tests with coverage
        entry: bash scripts/pre-push-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
